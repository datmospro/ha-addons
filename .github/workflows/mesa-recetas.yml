name: Mesa Recetas
on:
  push:
    paths: ['mesa_recetas/**', '.github/workflows/mesa-recetas.yml']
  pull_request:
    paths: ['mesa_recetas/**', '.github/workflows/mesa-recetas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesa_recetas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mesa_recetas/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-interface-check
          path: mesa_recetas/test-results
          retention-days: 7
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: mesa_recetas
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: mesa-recetas:test
      - name: Comprobar SQLite y arranque dentro del contenedor
        run: >-
          docker run --rm --entrypoint node mesa-recetas:test --input-type=module -e
          "import {createApp} from './server.mjs';
          const app=createApp();
          await new Promise(r=>app.server.listen(0,'127.0.0.1',r));
          const response=await fetch('http://127.0.0.1:'+app.server.address().port+'/health');
          if(!response.ok || app.snapshot().recipes.length!==12) process.exitCode=1;
          app.close();"
